name = "mechanical-way-board"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# The worker imports computeScore from ../../src/score.js so the server and the
# browser can never disagree about what a run is worth. Deploy from this
# directory but keep it inside the repo — wrangler bundles that relative import.

[[d1_databases]]
binding = "DB"
database_name = "mechanical-way"
# From `wrangler d1 create mechanical-way`. Not a secret (it is an opaque
# handle, useless without your Cloudflare credentials), so it lives here.
database_id = "PASTE_FROM_wrangler_d1_create"

[vars]
# Comma-separated list of origins allowed to WRITE to the board. Empty or unset
# allows any origin — fine locally, wrong in public: it lets anyone's page post
# scores to your board. Set it to your deployed origin before going live.
#
# This is config, not a secret, so it belongs in this file under version
# control. To keep your domain out of the repo instead, drop the line and pass
# it at deploy time:
#     wrangler deploy --var ALLOWED_ORIGINS:https://you.example
# For `wrangler dev`, put overrides in server/.dev.vars (git-ignored).
ALLOWED_ORIGINS = ""

# IP_SALT is a real secret and must never appear here:
#     wrangler secret put IP_SALT
